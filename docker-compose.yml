services:
  postgres:
    image: postgres:16-alpine
    container_name: classmate-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classmate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classmate_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-classmate_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classmate_user} -d ${POSTGRES_DB:-classmate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./03_app/backend
      dockerfile: Dockerfile
    container_name: classmate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-classmate_user}:${POSTGRES_PASSWORD:-classmate_secret_2026}@postgres:5432/${POSTGRES_DB:-classmate_db}
      - POSTGRES_USER=${POSTGRES_USER:-classmate_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-classmate_secret_2026}
      - POSTGRES_DB=${POSTGRES_DB:-classmate_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

  frontend:
    build:
      context: ./03_app/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: classmate-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api

volumes:
  postgres-data:

